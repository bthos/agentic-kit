name: Shellcheck

on:
  push:
    paths:
      - 'autoresearch/**'
      - 'tools/**'
  pull_request:
    paths:
      - 'autoresearch/**'
      - 'tools/**'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          echo "Running shellcheck on shell scripts"
          find . -type f -name "*.sh" -not -path "./.git/*" -print0 | xargs -0 shellcheck -x || true
        shell: bash
name: shellcheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        env:
          # Disabled with rationale:
          #   SC1091 — "not following: ..." for sourced files; CI lints per-file.
          #   SC2155 — declare-and-assign in one line, used deliberately for local-scope brevity.
          #   SC2034 — unused vars: tools/lib.sh defines color codes consumed by sourcing scripts.
          SHELLCHECK_OPTS: -e SC1091 -e SC2155 -e SC2034
        with:
          severity: warning
          scandir: '.'
          ignore_paths: >-
            .specstory
            .git

name: shellcheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        env:
          # Disabled with rationale:
          #   SC1091 — "not following: ..." for sourced files; CI lints per-file.
          #   SC2155 — declare-and-assign in one line, used deliberately for local-scope brevity.
          #   SC2034 — unused vars: shared/lifecycle/tools/lib.sh defines color codes consumed by sourcing scripts.
          SHELLCHECK_OPTS: -e SC1091 -e SC2155 -e SC2034
        with:
          severity: warning
          scandir: '.'
          ignore_paths: >-
            .specstory
            .git
